[package]
name = "wallet_core"
version = "0.2.0"
edition = "2021"
rust-version = "1.99"
publish = false
description = "Restricted mainnet wallet signing and durable transaction journal"

[lib]
name = "wallet_core"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
default = ["native"]
native = ["dep:rusqlite", "dep:uniffi", "dep:wallet_privacy_transport"]
wasm = ["dep:wasm-bindgen", "dep:js-sys"]
bindgen = ["native", "uniffi/cli"]

[dependencies]
wallet_privacy_transport = { path = "../privacy-transport", optional = true }
aes-gcm = { version = "=0.10.3", features = ["std", "zeroize"] }
bip39 = { version = "=2.2.2", features = ["zeroize"] }
bip32 = { version = "=0.6.0", default-features = false, features = ["alloc", "secp256k1"] }
k256 = { version = "=0.14.0", default-features = false, features = ["std", "ecdsa"] }
sha3 = "=0.10.9"
sha2 = "=0.10.9"
hkdf = "=0.13.0"
hmac = "=0.13.0"
sha2_modern = { package = "sha2", version = "=0.11.1" }
bs58 = { version = "=0.5.1", features = ["check"] }
base64 = "=0.22.1"
prost = "=0.14.4"
ed25519-dalek = { version = "=2.2.0", features = ["zeroize"] }
slip10_ed25519 = "=0.1.3"
solana-pubkey = { version = "=3.0.0", features = ["curve25519"] }
solana-instruction = "=3.0.0"
solana-message = { version = "=3.0.1", features = ["bincode"] }
solana-hash = "=3.0.0"
getrandom = "=0.3.4"
zeroize = { version = "=1.9.1", features = ["derive"] }
primitive-types = "=0.13.1"
rlp = "=0.6.1"
hex = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
rusqlite = { version = "=0.41.1", features = ["bundled"], optional = true }
uniffi = { version = "=0.32.2", default-features = false, optional = true }
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
wasm-bindgen = { version = "=0.2.130", optional = true }
js-sys = { version = "=0.3.107", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.3.4", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "=0.2.17", features = ["js"] }
getrandom04 = { package = "getrandom", version = "=0.4.3", features = ["wasm_js"] }

[dev-dependencies]
tempfile = "=3.27.0"
proptest = "=1.12.0"

