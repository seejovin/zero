[package]
name = "wallet_gas_service"
version = "0.11.0"
edition = "2021"
rust-version = "1.99"
publish = false
description = "Fail-closed private-payment gas service policy and durable operator journal"

[[bin]]
name = "wallet-gas-service"
path = "src/main.rs"

[[bin]]
name = "wallet-ohttp-relay"
path = "src/relay_main.rs"

[dependencies]
wallet_core = { path = "../core", default-features = false, features = ["native"] }
primitive-types = "=0.13.1"
rusqlite = { version = "=0.41.1", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha3 = "=0.10.9"
hex = "=0.4.3"
rlp = "=0.6.1"
k256 = { version = "=0.14.0", default-features = false, features = ["std", "ecdsa"] }
thiserror = "=2.0.21"
ohttp = { version = "=0.8.0", default-features = false, features = ["server", "rust-hpke"] }
bhttp = { version = "=0.8.0", default-features = false }
sha2 = "=0.10.9"
zeroize = "=1.9.1"
ed25519-dalek = { version = "=2.2.0", features = ["zeroize"] }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "net", "time", "sync", "macros", "process", "io-util", "signal"] }
hyper = { version = "=1.9.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
http-body-util = "=0.1.3"
bytes = "=1.12.1"
reqwest = { version = "=0.13.3", default-features = false, features = ["blocking", "rustls-no-provider", "json"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tempfile = "=3.27.0"
wallet_privacy_transport = { path = "../privacy-transport" }
ohttp = { version = "=0.8.0", default-features = false, features = ["client", "server", "rust-hpke"] }

